name: Build CLI

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ released ]

jobs:
  build_binary_linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu


    steps:
      - uses: actions/checkout@v6

      - name: Rust Setup
        id: setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Env init
        run: |
          cargo install cargo-deb
          sudo apt-get -qq update
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -qq -y gcc-aarch64-linux-gnu
          fi

      - name: Set up Python for PR validation
        if: github.event_name == 'pull_request' && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Validate release script syntax without running scripts
        if: github.event_name == 'pull_request' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/znotify-python-cache
        run: python -m py_compile scripts/version.py scripts/winget.py

      - name: Test CLI on native host
        if: startsWith(matrix.target, 'x86_64-')
        run: cargo test --locked --bins

      - name: Build binary
        run: |
          cargo build --locked --release --bins --target ${{ matrix.target }}
          cargo deb --target ${{ matrix.target }}


      - name: Rename binary
        shell: bash
        run: |
          mv -f target/${{ matrix.target }}/release/znotify target/${{ matrix.target }}/release/znotify-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/znotify-${{ matrix.target }}
            target/${{ matrix.target }}/debian/*.deb

  build_binary_macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v6

      - name: Rust Setup
        id: setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Env init
        run: |
          rustup target add ${{ matrix.target }}

      - name: Test CLI on native host
        if: startsWith(matrix.target, 'x86_64-')
        run: cargo test --locked --bins

      - name: Build binary
        run: |
          cargo build --locked --release --bins --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          mv -f target/${{ matrix.target }}/release/znotify target/${{ matrix.target }}/release/znotify-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/znotify-${{ matrix.target }}

  build_binary_windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6

      - name: Rust Setup
        id: setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Env init
        run: |
          rustup target add ${{ matrix.target }}

      - name: Test CLI on native host
        if: startsWith(matrix.target, 'x86_64-')
        run: cargo test --locked --bins

      - name: Build binary
        run: |
          cargo build --locked --release --bins --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          mv -f target/${{ matrix.target }}/release/znotify.exe target/${{ matrix.target }}/release/znotify-${{ matrix.target }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/znotify-${{ matrix.target }}.exe

  verify_artifacts:
    if: github.event_name == 'pull_request'
    needs: [ build_binary_linux, build_binary_macos, build_binary_windows ]
    runs-on: ubuntu-latest
    steps:
      - name: Download PR artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: binary
      - name: Verify platform binaries
        shell: bash
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            test -s "binary/$target/release/znotify-$target"
          done
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            test -s "binary/$target/znotify-$target"
          done
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            test -s "binary/$target/znotify-$target.exe"
          done

  release_nightly:
    if: github.event_name == 'push'
    needs: [ build_binary_linux, build_binary_macos, build_binary_windows ]
    runs-on: ubuntu-latest
    steps:
      - name: Get all artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: binary

      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Development Build"
          files: |
            binary/*/*
            binary/*/*/*

  release_stable:
    if: github.event_name == 'release'
    needs: [ build_binary_linux, build_binary_macos, build_binary_windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 'master'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Get all artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: binary

      - name: Check version
        run: python scripts/version.py

      - name: Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ github.event.release.tag_name }}"
          title: "${{ github.event.release.tag_name }}"
          prerelease: false
          files: |
            binary/*/*
            binary/*/*/*

      - name: Generate winget manifest
        run: |
          python scripts/winget.py
